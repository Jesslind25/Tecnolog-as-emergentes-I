<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Triage - Evaluación Inicial</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="pantalla-datos">
    <h1>Datos Personales</h1>
    <form id="form-datos" onsubmit="return validarDatosPersonales()">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" required />

      <label for="telefono">Teléfono (10 dígitos):</label>
      <input type="tel" id="telefono" name="telefono" required maxlength="10" pattern="\d{10}" placeholder="Ej: 3001234567" />

      <label for="eps">EPS:</label>
      <select id="eps" name="eps" required>
        <option value="" disabled selected>Selecciona tu EPS</option>
        <option value="Sura">Sura</option>
        <option value="Sanitas">Sanitas</option>
        <option value="Coomeva">Coomeva</option>
        <option value="Compensar">Compensar</option>
        <option value="Nueva EPS">Nueva EPS</option>
        <option value="Colsanitas">Colsanitas</option>
        <option value="Otra">Otra</option>
      </select>

      <label for="direccion">Dirección o Barrio (solo Bogotá):</label>
      <input type="text" id="direccion" name="direccion" required
        placeholder="Ej: Chapinero o Cra 90a #85-01"
        pattern=".{5,60}" />

      <button type="submit">Siguiente</button>
    </form>
  </div>

  <div id="pantalla-sintomas" style="display:none;">
    <h1>Evaluación de Síntomas</h1>
    <form id="form-sintomas" onsubmit="return evaluar()">
      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" required min="0" max="120" oninput="mostrarOpcionesGenero()" />

      <label for="genero">Género:</label>
      <select id="genero" name="genero" required onchange="mostrarOpcionesGenero()">
        <option value="" disabled selected>Selecciona tu género</option>
        <option value="mujer">Mujer</option>
        <option value="hombre">Hombre</option>
        <option value="otro">Otro</option>
      </select>

      <div id="embarazo-container" style="display:none;">
        <label for="embarazo">¿Está embarazada?</label>
        <select id="embarazo" name="embarazo">
          <option value="no" selected>No</option>
          <option value="si">Sí</option>
        </select>
      </div>

      <fieldset>
        <legend>Condiciones médicas (puede seleccionar varias):</legend>
        <label><input type="checkbox" name="condiciones" value="diabetes"> Diabetes</label>
        <label><input type="checkbox" name="condiciones" value="hipertension"> Hipertensión</label>
        <label><input type="checkbox" name="condiciones" value="asma"> Asma</label>
        <label><input type="checkbox" name="condiciones" value="cancer"> Cáncer</label>
        <label><input type="checkbox" name="condiciones" value="ninguna"> Ninguna</label>
      </fieldset>

      <fieldset>
        <legend>Síntomas (puede seleccionar varios):</legend>
        <label><input type="checkbox" name="sintomas" value="pecho"> Dolor en el pecho</label>
        <label><input type="checkbox" name="sintomas" value="dificultad"> Dificultad para respirar</label>
        <label><input type="checkbox" name="sintomas" value="convulsiones"> Convulsiones</label>
        <label><input type="checkbox" name="sintomas" value="desmayo"> Desmayo</label>
        <label><input type="checkbox" name="sintomas" value="fiebre"> Fiebre</label>
        <label><input type="checkbox" name="sintomas" value="tos"> Tos</label>
        <label><input type="checkbox" name="sintomas" value="mareo"> Mareo</label>
        <label><input type="checkbox" name="sintomas" value="nauseas"> Náuseas</label>
        <label><input type="checkbox" name="sintomas" value="dolor_estomacal"> Dolor estomacal</label>
        <label><input type="checkbox" name="sintomas" value="erupcion"> Erupción cutánea</label>
        <label><input type="checkbox" name="sintomas" value="ninguno"> Ninguno</label>
      </fieldset>

      <button type="submit">Evaluar</button>
    </form>

    <div id="resultado" style="margin-top:20px; padding:15px; border-radius: 5px; font-weight:bold;"></div>
    <div id="centros-urgencias" style="margin-top:20px;"></div>
  </div>

  <script>
    function mostrarOpcionesGenero() {
      const genero = document.getElementById("genero").value;
      const embarazoDiv = document.getElementById("embarazo-container");
      embarazoDiv.style.display = (genero === "mujer") ? "block" : "none";
    }

    function validarDatosPersonales() {
      const direccion = document.getElementById('direccion').value.trim();

      if (direccion.length < 5 || direccion.length > 60) {
        alert("La dirección debe tener entre 5 y 60 caracteres.");
        return false;
      }

      // Mostrar siguiente pantalla
      document.getElementById("pantalla-datos").style.display = "none";
      document.getElementById("pantalla-sintomas").style.display = "block";
      return false; // evita el envío del formulario
    }

    function evaluar() {
      const sintomasSeleccionados = [...document.querySelectorAll('input[name="sintomas"]:checked')].map(e => e.value);
      let resultado = "";

      if (sintomasSeleccionados.includes("pecho") || sintomasSeleccionados.includes("dificultad") || sintomasSeleccionados.includes("convulsiones") || sintomasSeleccionados.includes("desmayo")) {
        resultado = "🟥 Atención urgente: Dirígete inmediatamente al centro de salud más cercano.";
      } else if (sintomasSeleccionados.includes("fiebre") || sintomasSeleccionados.includes("tos") || sintomasSeleccionados.includes("mareo")) {
        resultado = "🟧 Evaluación médica recomendada: Considera consultar al médico si persisten los síntomas.";
      } else {
        resultado = "🟩 Puedes manejar los síntomas en casa. Mantente alerta a cualquier cambio.";
      }

      document.getElementById("resultado").textContent = resultado;
      return false;
    }
  </script>
</body>
</html>
